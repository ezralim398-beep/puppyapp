name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icon (optional, skipped on failure)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android

      - name: Notification icon and permissions
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/ic_stat.xml android/app/src/main/res/drawable/ic_stat.xml
          python3 scripts/patch_manifest.py

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: puppy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
